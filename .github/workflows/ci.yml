name: plugin-invariants
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Invariant check (configUrl self-referencing, versioni, sintassi)
        run: |
          python3 - <<'PYEOF'
          import json, re
          cfg = json.load(open('config.json'))
          CANON = 'https://raw.githubusercontent.com/hitclawagent/MeshCentral-pkgmanager/main/config.json'
          assert cfg['configUrl'] == CANON, f"INVARIANTE ROTTA: configUrl field deve essere self-referencing ({cfg['configUrl']})"
          assert cfg['downloadUrl'].startswith('https://raw.githubusercontent.com/hitclawagent/MeshCentral-pkgmanager/main/'), \
              f"INVARIANTE ROTTA: downloadUrl fuori dal raw main ({cfg['downloadUrl']})"
          src = open('pkgmanager.js').read()
          m = re.search(r"obj\.version = '([^']+)'", src)
          assert m, 'obj.version mancante'
          assert m.group(1) == cfg['version'], f"version mismatch: pkgmanager.js {m.group(1)} != config.json {cfg['version']}"
          rd = open('README.md').read()
          assert f"Current version: **{cfg['version']}**" in rd, 'README current version disallineata'
          print(f'invarianti OK (v{cfg["version"]})')
          PYEOF
      - name: node --check
        run: node --check pkgmanager.js
      - name: client flow end-to-end (pkgOsScan)
        run: node tools/test-client.js
      - name: server flow end-to-end (osfetch bundles)
        run: node tools/test-osfetch.js
      - name: debian version comparator
        run: node tools/test-vercmp.js
