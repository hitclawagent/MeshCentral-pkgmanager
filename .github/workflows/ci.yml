name: plugin-invariants
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Invariant check (configUrl self-reference, versions)
        run: |
          python3 - <<'PYEOF'
          import json
          cfg = json.load(open('config.json'))
          CANON = 'https://raw.githubusercontent.com/hitclawagent/MeshCentral-pkgmanager/main/config.json'
          assert cfg['configUrl'] == CANON, f"INVARIANTE ROTTA: configUrl field deve essere self-referencing ({cfg['configUrl']})"
          assert cfg['downloadUrl'].startswith('https://raw.githubusercontent.com/hitclawagent/MeshCentral-pkgmanager/main/'), \
              f"INVARIANTE ROTTA: downloadUrl fuori dal raw main ({cfg['downloadUrl']})"
          print(f'config OK: v{cfg["version"]}, configUrl self-referencing')
          PYEOF
      - name: Versioni coerenti (config.json / pkgmanager.js / README)
        run: bash -c 'V=$(python3 -c "import json;print(json.load(open(\"config.json\"))[\"version\"])"); grep -q "obj.version = '"'"'$V'"'"'" pkgmanager.js; grep -q "Current version: \*\*$V\*\*" README.md; echo "versioni OK: $V"'
      - name: node --check
        run: node --check pkgmanager.js
      - name: client flow end-to-end (pkgOsScan)
        run: node tools/test-client.js
